name: Provisionar lotes de assets

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Numero do primeiro lote"
        required: true
        default: "1"
      quantidade:
        description: "Quantidade de releases em rascunho"
        required: true
        default: "60"

permissions:
  contents: write

jobs:
  provisionar:
    runs-on: ubuntu-latest
    steps:
      - name: Criar releases em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          INICIO: ${{ inputs.inicio }}
          QUANTIDADE: ${{ inputs.quantidade }}
        run: |
          set -euo pipefail
          fim=$((INICIO + QUANTIDADE - 1))
          for numero in $(seq "$INICIO" "$fim"); do
            lote=$(printf "%03d" "$numero")
            tag="assets-batch-$lote"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag ja existe"
              continue
            fi
            gh release create "$tag" --draft --title "Guizzprints · Lote $lote" --notes "Lote reservado para ate 1.000 arquivos do catalogo Guizzprints. Publique somente depois de enviar os downloads deste lote."
          done
